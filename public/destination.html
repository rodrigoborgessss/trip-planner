<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TripPlanner — Destino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/destination.css">
</head>
<body>
  <nav class="nav">
    <a href="search.html" class="backmap" title="Mapa" aria-label="Mapa"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg></a>
    <a href="results.html" data-i18n="nav.results">Resultados</a>
    <span class="brand"><span class="dot"></span>TripPlanner</span>
  </nav>

  <div class="page">
    <div id="content"><p class="loading">A montar o destino…</p></div>
  </div>

  <template id="tpl">
    <div class="hero">
      <div class="flag" data-flag>📍</div>
      <h1 data-name>—</h1>
      <div class="country" data-country>—</div>
      <div class="strip">
        <div class="stat"><small data-i18n="m.distance">Distância</small><b data-dist>—</b></div>
        <div class="stat"><small data-i18n="m.flightEst">Voo estimado</small><b data-time>—</b></div>
        <div class="stat total"><small data-i18n="m.total">Total estimado</small><b data-total>—</b></div>
      </div>
    </div>

    <div class="tabs" data-tabs></div>

    <div class="section" data-sec="flights"></div>
    <div class="section" data-sec="hotels"></div>
    <div class="section" data-sec="transport"></div>
    <div class="section" data-sec="leisure"></div>
    <div class="section" data-sec="culture"></div>
    <div class="section" data-sec="extras"></div>
  </template>

  <script type="module" src="assets/js/pages/destination.js"></script>
  <script type="module" src="assets/js/i18n.js"></script>
  <script type="module" src="assets/js/theme.js"></script>
</body>
</html>
